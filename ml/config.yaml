# Parameter umum pipeline ML. Parameter lokasi ada di ml/sites/<lokasi>.yaml.
model:
  n_folds: 5
  params:            # dipakai di semua kandidat
    objective: "reg:absoluteerror"
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 0
  grid:
    max_depth: [2, 3, 4]
    n_estimators: [100, 300]
    learning_rate: [0.03]

detector:
  min_sun_elevation: 10      # derajat
  min_expected: 0.10         # per kapasitas; di bawah ini rasio tidak bermakna
  clear_index_bins: [0.3, 0.6]
  z_clip: 3.0                # satu jam berawan tidak boleh memicu alarm sendirian
  cusum_k: 0.5               # simpangan terkecil yang dianggap berarti (satuan sigma)
  target_false_alarm_per_week: 0.5
  dead_output: 0.01          # daya ~0 saat cerah: langsung alarm
  dead_expected: 0.30
  threshold_hours: [9, 15]   # alarm biasa, jam lokal
  threshold_frac: 0.20       # untuk grafik; versi adil dicari saat kalibrasi

causes:
  history_days: 7
  near_zero_ratio: 0.10
  clear_sky_min: 0.6
  recent_hours: 12
  loose_min_hours: 6
  loose_p90_min: 0.30
  soiling_min_deficit: 0.10
  shading_min_days: 3
  shading_hour_gap: 0.25
  shading_repeat: 0.5

battery:
  full_v: 14.4               # aki penuh: controller membatasi panel, bukan gangguan (Yoga: cek PWM/MPPT)
  # median sag aki 20 Ah BBOXX saat baru = 0,10 V/Ah, batas = 1,25 x itu. Kapasitas lain perlu skala ulang.
  weak_sag_v_per_ah: 0.125
  recent_days: 7
  missing_hours: 2

faults:
  n_events: 10
  seed: 7
  start_hour_local: 9
  variants:
    cable_cut:       [{days: 1}, {days: 3}]
    soiling:         [{rate_per_day: 0.01, days: 21}, {rate_per_day: 0.02, days: 14}, {rate_per_day: 0.04, days: 10}]
    partial_shading: [{depth: 0.3, hour: 13, length_h: 2, days: 5}, {depth: 0.6, hour: 13, length_h: 2, days: 5}]
    loose_connector: [{days: 2, prob: 0.3}, {days: 5, prob: 0.3}]
  soiling_max_loss: 0.30
  rain_wash_mm: 5
